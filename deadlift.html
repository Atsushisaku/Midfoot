    <!-- プロトタイプなので公開せず、アクセス計測（GoatCounter）も入れない（仕様 §0） -->
  </head>
  <body>
    <div id="app">
      <section class="stage">
        <svg id="fig" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="corner left">
          <button class="cornerbtn" id="compareBtn" aria-pressed="false"></button>
          <button class="cornerbtn ghost" id="notesBtn" aria-expanded="false"></button>
        </div>
        <!-- 言語切替（Rev.8）。markup はスクワット版 index.html と同じ -->
        <div class="corner right">
          <div class="seg lang" id="lang" role="group">
            <button data-v="ja">JA</button>
            <button data-v="en">EN</button>
          </div>
        </div>
      </section>

      <section class="controls">
        <!--
          挙上は両ペイン共有。図のすぐ下に置く：モバイルでは設定ペインが縦に
          伸びるため、下端に置くと画面外へ出て「動かしながら図を見る」ができなくなる
        -->
        <div class="row sliders depth-row" id="liftRow"></div>
        <!-- 設定ペイン。単体=1ペイン、比較=2ペイン。中身は app.ts が生成する -->
        <div class="panes" id="panes"></div>
      </section>

      <!-- 注記の中身は strings.ts の notesList から app.ts が入れる -->
      <aside id="notes" hidden>
        <button id="notesClose">×</button>
        <ul id="notesList"></ul>
      </aside>
    </div>
    <script type="module" src="/src/deadlift/app.ts"></script>
  </body>
</html>
