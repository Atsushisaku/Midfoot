    <meta name="theme-color" content="#3b9de8" />
    <title>Midfoot デッドリフト</title>
    <!-- アクセス計測。Cookie も IP も保存しない（GoatCounter）。
         async なので取得に失敗してもアプリの描画には影響しない＝オフラインでも動く。
         file:// で開いたときにも解決できるよう、プロトコル相対ではなく https を明示する -->
    <script data-goatcounter="https://atsushisaku.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="app">
      <section class="stage">
        <svg id="fig" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="corner left">
          <button class="cornerbtn ghost" id="notesBtn" aria-expanded="false"></button>
        </div>
        <!-- 種目の行き来。`./` ではなく `index.html` にしてあるのは、
             単一HTMLを2つ並べて file:// で開く運用（ダブルクリック起動）でも辿れるようにするため。
             Pages（/Midfoot/deadlift.html）でも dev サーバでも同じように解決できる。
             文言は app.ts が入れる -->
        <div class="corner center">
          <a class="cornerbtn ghost link" id="exLink" href="index.html"></a>
        </div>
        <!-- 言語切替（Rev.8）。markup はスクワット版 index.html と同じ -->
        <div class="corner right">
          <div class="seg lang" id="lang" role="group">
            <button data-v="ja">JA</button>
            <button data-v="en">EN</button>
          </div>
        </div>
      </section>

      <section class="controls">
        <!--
          操作バー。左にボタン群、中央に再生＋挙上。grid の 1fr auto 1fr で、
          左にボタンを置いても中央列（＝スライダー）が図の中心と揃ったままになる。

          挙上は両ペイン共有で、図のすぐ下に置く：モバイルでは設定ペインが縦に
          伸びるため、下端に置くと画面外へ出て「動かしながら図を見る」ができなくなる
        -->
        <!-- 操作ボタンはスライダーの一段上に右詰めで置く -->
        <div class="row ctlbar">
          <button class="cornerbtn" id="compareBtn" aria-pressed="false"></button>
          <!-- 頻出エラーのページへ。文言と表示可否（日本語のときだけ）は app.ts が決める -->
          <a class="cornerbtn ghost link" id="errLink" href="deadlift-errors.html"></a>
        </div>
        <div class="row sliders depth-row" id="liftRow"></div>
        <!-- 設定ペイン。単体=1ペイン、比較=2ペイン。中身は app.ts が生成する -->
        <div class="panes" id="panes"></div>
      </section>

      <!-- 注記。図の左上のボタンから開く。ビューポート基準の固定配置 -->
      <aside id="notes" hidden>
        <button id="notesClose">×</button>
        <ul id="notesList"></ul>
      </aside>
    </div>
    <script type="module" src="/src/deadlift/app.ts"></script>
  </body>
</html>
