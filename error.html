<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Midfoot エラー提示</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      エラー提示アプリのプロトタイプ（要件: docs/error-app-requirements.md）。

      dev 専用エントリで、`npm run build` には入れていない。デッドリフト版が
      d4a9640 でそうしたのと同じ扱い。評価が済んで公開すると決めてから
      vite.error.config.ts を足す（singlefile の 1 エントリ制約があるので 3 回目のビルドになる）。

      日本語のみ。i18n はプロトタイプの評価には不要なので後回し。
    -->
    <div id="app">
      <section class="stage">
        <svg id="fig" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="corner center">
          <a class="cornerbtn ghost link" href="deadlift.html">デッドリフト</a>
        </div>
      </section>

      <section class="controls">
        <div class="row sliders depth-row" id="liftRow"></div>
        <div id="errPanel"></div>
      </section>
    </div>
    <script type="module" src="/src/error/app.ts"></script>
  </body>
</html>
