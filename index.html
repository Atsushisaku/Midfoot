    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#3b9de8" />
    <title>スクワット姿勢可視化</title>
    <!-- アクセス計測。Cookie も IP も保存しない（GoatCounter）。
         async なので取得に失敗してもアプリの描画には影響しない＝オフラインでも動く。
         file:// で開いたときにも解決できるよう、プロトコル相対ではなく https を明示する -->
    <script data-goatcounter="https://atsushisaku.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="app">
      <!--
        ヘッダー。サイト名・種目ナビ・言語切替。
        現在地はナビのハイライト（aria-current）で示す。エラー例はデッドリフトの
        下位ページなので、ナビはデッドリフトを選択状態にしたうえで crumb を足す。
        文言と href は app.ts が入れる（言語を ?lang= で引き継ぐため）。
      -->
      <header class="topbar">
        <span class="brand">Midfoot</span>
        <nav class="seg nav" id="nav">
          <a data-page="squat" href="index.html"></a>
          <a data-page="deadlift" href="deadlift.html"></a>
        </nav>
        <span class="crumb" id="crumb" hidden></span>
        <div class="topbar-right">
          <div class="seg lang" id="lang" role="group">
            <button data-v="ja">JA</button>
            <button data-v="en">EN</button>
          </div>
        </div>
      </header>
      <section class="stage">
        <svg id="fig" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
        <!-- 注記。図の右上に置き、パネルはそのボタンの真下に開く -->
        <div class="corner right">
          <button class="cornerbtn ghost" id="notesBtn" aria-expanded="false"></button>
        </div>
        <aside id="notes" hidden>
          <button id="notesClose">×</button>
          <ul id="notesList"></ul>
        </aside>
        <!-- 操作ボタンは図の左下（スライダーの上の仕切り線より上）に左詰めで置く -->
        <div class="corner bottomleft">
          <button class="cornerbtn" id="compareBtn" aria-pressed="false"></button>
        </div>
      </section>

      <section class="controls">
        <!--
          深さは両ペイン共有（§8.5）。図のすぐ下に置く：モバイルでは設定ペインが縦に
          伸びるため、下端に置くと画面外へ出て「動かしながら図を見る」ができなくなる
        -->
        <!--
          操作バー。左にボタン群、中央に再生＋深さ。grid の 1fr auto 1fr で、
          左にボタンを置いても中央列（＝スライダー）が図の中心と揃ったままになる
        -->
        <div class="row sliders depth-row" id="depthRow"></div>
        <!-- 設定ペイン。単体=1ペイン、比較=2ペイン。中身は app.ts が生成する（§8.5） -->
        <div class="panes" id="panes"></div>
      </section>

    </div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
