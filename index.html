    <meta name="theme-color" content="#3b9de8" />
    <title>スクワット姿勢可視化</title>
    <!-- アクセス計測。Cookie も IP も保存しない（GoatCounter）。
         async なので取得に失敗してもアプリの描画には影響しない＝オフラインでも動く。
         file:// で開いたときにも解決できるよう、プロトコル相対ではなく https を明示する -->
    <script data-goatcounter="https://atsushisaku.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="app">
      <section class="stage">
        <svg id="fig" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="corner left">
          <button class="cornerbtn" id="compareBtn" aria-pressed="false"></button>
          <button class="cornerbtn ghost" id="notesBtn" aria-expanded="false"></button>
        </div>
        <!-- 種目の行き来。相対リンクにするのは Pages のサブパス（/Midfoot/）でも
             dev サーバでも、単一HTMLを2つ並べたオフライン運用でも同じように
             辿れるようにするため。文言は app.ts が入れる -->
        <div class="corner center">
          <a class="cornerbtn ghost link" id="exLink" href="deadlift.html"></a>
        </div>
        <div class="corner right">
          <div class="seg lang" id="lang" role="group">
            <button data-v="ja">JA</button>
            <button data-v="en">EN</button>
          </div>
        </div>
      </section>

      <section class="controls">
        <!--
          深さは両ペイン共有（§8.5）。図のすぐ下に置く：モバイルでは設定ペインが縦に
          伸びるため、下端に置くと画面外へ出て「動かしながら図を見る」ができなくなる
        -->
        <div class="row sliders depth-row" id="depthRow"></div>
        <!-- 設定ペイン。単体=1ペイン、比較=2ペイン。中身は app.ts が生成する（§8.5） -->
        <div class="panes" id="panes"></div>
      </section>

      <!-- 注記の中身は i18n.ts の notesList から app.ts が入れる（§9） -->
      <aside id="notes" hidden>
        <button id="notesClose">×</button>
        <ul id="notesList"></ul>
      </aside>
    </div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
